[project]
name = "coinmarketcap"
version = "4.0.1"
description = "Official CoinMarketCap Pro API Python SDK"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "CoinMarketCap", email = "api@coinmarketcap.com"}]
requires-python = ">=3.10"
keywords = ["coinmarketcap", "cmc", "cryptocurrency", "api", "sdk", "bitcoin", "ethereum"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0,<1.0.0",
    "attrs>=22.2.0",
    "python-dateutil>=2.8.0",
]

[project.urls]
Homepage = "https://coinmarketcap.com/api/documentation/"
Repository = "https://github.com/OpenCMC/coinmarketcap-api-python"
Issues = "https://github.com/OpenCMC/coinmarketcap-api-python/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coinmarketcap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
